name: Sync Upstream & Keep Custom CIDRs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Daily at 02:00 AM UTC+8

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        id: sync_upstream
        run: |
          git remote add upstream https://github.com/MetaCubeX/meta-rules-dat.git 2>/dev/null || true
          git fetch upstream master

          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          BASE_MERGE=$(git merge-base HEAD upstream/master)

          if [ "$UPSTREAM_HEAD" = "$BASE_MERGE" ]; then
            echo "Already up-to-date with upstream. No merge required."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Upstream has new commits ($UPSTREAM_HEAD). Merging with -X theirs strategy..."
          # Merge upstream favoring upstream changes on any conflicts
          git merge -X theirs upstream/master --no-edit -m "chore(sync): 自动合并上游 MetaCubeX/meta-rules-dat 更新"

          # Guarantee our custom hook step exists in run.yml
          python3 custom-rules/ensure-workflow-step.py

          # Also guarantee custom domestic domains are retained in resouces/direct.txt if overwritten by upstream
          if [ -f "custom-rules/china-custom-domains.txt" ] && [ -f "resouces/direct.txt" ]; then
            while read -r dom; do
              [ -z "$dom" ] && continue
              case "$dom" in
                \#*) continue ;;
              esac
              if ! grep -Fxq "$dom" resouces/direct.txt; then
                echo "$dom" >> resouces/direct.txt
              fi
            done < custom-rules/china-custom-domains.txt
          fi

          # Also guarantee custom proxy domains are retained in resouces/proxy.txt if overwritten by upstream
          if [ -f "custom-rules/proxy-custom-domains.txt" ] && [ -f "resouces/proxy.txt" ]; then
            while read -r dom; do
              [ -z "$dom" ] && continue
              case "$dom" in
                \#*) continue ;;
              esac
              if ! grep -Fxq "$dom" resouces/proxy.txt; then
                echo "$dom" >> resouces/proxy.txt
              fi
            done < custom-rules/proxy-custom-domains.txt
          fi

          git add -A
          if ! git diff --staged --quiet; then
            echo "Committing preserved custom rules hooks..."
            git commit -m "chore: 保持自定义阿里Anycast与直连/代理域名注入钩子" || true
          fi

          # Always push to origin master when upstream had new commits merged
          echo "Pushing merged upstream changes to origin master..."
          git push origin master
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Trigger Build Workflow
        if: steps.sync_upstream.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering build rules workflow..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"master"}' || true

      - name: Keepalive Workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 检查距最近一次提交的时间，超过 40 天时自动生成心跳 Commit 并推送，彻底重置 60 天闲置倒计时
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DAYS_DIFF=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "距上次提交已过去: $DAYS_DIFF 天"
          if [ $DAYS_DIFF -ge 40 ]; then
            echo "闲置超过 40 天，触发心跳保活 Commit 永久重置 60 天计时器..."
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/.keepalive
            git commit -m "chore(ci): keepalive heartbeat to reset 60-day inactivity timer [skip ci]" || true
            git push origin master || true
          else
            echo "活跃状态正常（低于 40 天），无需生成心跳 Commit。"
          fi

          # 2. 每天调用 GitHub 官方 API 刷新/重置所有定时工作流的活跃状态
          echo "Keeping scheduled workflows active via GitHub API..."
          for wf in sync-upstream.yml run.yml delete.yml; do
            echo "Re-enabling/touching workflow: $wf"
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done

