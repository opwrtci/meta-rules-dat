name: Sync Upstream & Keep Custom CIDRs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Daily at 02:00 AM UTC+8

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        id: sync_upstream
        run: |
          git remote add upstream https://github.com/MetaCubeX/meta-rules-dat.git || true
          git fetch upstream master

          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          BASE_MERGE=$(git merge-base HEAD upstream/master)

          if [ "$UPSTREAM_HEAD" = "$BASE_MERGE" ]; then
            echo "Already up-to-date with upstream. No merge required."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Upstream has new commits. Merging with -X theirs strategy..."
          # Merge upstream favoring upstream changes on any conflicts
          git merge -X theirs upstream/master --no-edit -m "chore(sync): 自动合并上游 MetaCubeX/meta-rules-dat 更新" || true

          # Guarantee our custom hook step exists in run.yml
          python3 custom-rules/ensure-workflow-step.py

          git add -A
          if git diff --staged --quiet; then
            echo "No staged changes after merge."
          else
            git commit -m "chore: 保持自定义阿里Anycast直连注入钩子" || true
            git push origin master
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Build Workflow
        if: steps.sync_upstream.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering build rules workflow..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"master"}' || true
